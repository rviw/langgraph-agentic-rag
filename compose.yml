services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: production
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:?Variable not set}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:?Variable not set}

    env_file:
      - .env

    ports:
      - "8000:8000"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/utils/health")
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped
