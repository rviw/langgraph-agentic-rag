[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.14,<4.0"
dependencies = [
    "alembic==1.19.1",
    "cohere==7.0.8",
    "fastapi[standard]==0.141.1",
    "langchain==1.3.15",
    "langchain-openai==1.4.3",
    "langchain-text-splitters==1.1.2",
    "langfuse==4.14.4",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.15.0",
    "pypdf==6.16.1",
    "sqlmodel==0.0.39",
    "supabase==2.31.0",
    "tavily-python==0.7.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.2",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
isort.known-first-party = ["app", "tests"]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "UP",     # pyupgrade
  "ARG001", # unused function arguments
  "T20",    # no print statements
]
ignore = [
  "E501", # line length is handled by the formatter
  "B008", # FastAPI dependencies are function calls in argument defaults
]
