# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
project_id = "langgraph-agentic-rag"

[api]
enabled = false

[db]
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage.buckets.documents]
file_size_limit = "10MiB"
allowed_mime_types = ["application/pdf"]

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
signing_keys_path = "./signing_keys.json"

[edge_runtime]
enabled = false

[analytics]
enabled = false
